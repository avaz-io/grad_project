name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mentoria
          POSTGRES_USER: mentoria
          POSTGRES_PASSWORD: mentoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DB_NAME: mentoria
      DB_USER: mentoria
      DB_PASSWORD: mentoria
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --cov=apps
